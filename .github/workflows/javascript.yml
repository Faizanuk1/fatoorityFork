name: javascript
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish package to npm (select a version tag)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release metadata
        run: python3 scripts/check_release.py
      - name: Check publication tag
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$RELEASE_REF_TYPE" = tag
          python3 scripts/check_release.py --tag "$RELEASE_TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: bindings/js/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm ci --prefix bindings/js
      - run: cargo install diplomat-tool --version 0.16.1 --locked
      - run: python3 scripts/generate_bindings.py --check
      - run: python3 scripts/build_js.py
      - run: python3 scripts/check_wasm_size.py --json
      - run: npm run check --prefix bindings/js
      - run: node bindings/js/tests/runtime.test.mjs
      - run: npx --prefix bindings/js playwright install --with-deps chromium
      - run: node bindings/js/tests/browser.mjs
      - run: python3 scripts/check_js_package.py --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-dist
          path: dist/fatoority-*.tgz
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: wasm
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Publish tested package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./dist/fatoority-*.tgz --access public --ignore-scripts
