[workspace]
resolver = "3"

members = [
    "fatoora-derive",
    "fatoora-core",
    "fatoora-cli",
    "fatoora-ffi",
]

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = true

# Used only by scripts/build_js.py for the WASM package.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

# Native assets distributed in NuGet packages.
[profile.dotnet-release]
inherits = "release"
strip = "symbols"

# Native assets distributed in JVM JARs and Android AARs.
[profile.jvm-release]
inherits = "release"
strip = "symbols"
